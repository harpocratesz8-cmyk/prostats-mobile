name: fm-ids
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run script
        run: |
          mkdir -p out
          python3 tools/fm_ids.py out > out/log.txt 2>&1 || true
      - name: publish to fm-data branch
        run: |
          cd out
          git init -q -b fm-data
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "fm data"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fm-data
