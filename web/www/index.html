<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProStats Mobile</title>
<meta name="theme-color" content="#0A1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ProStats">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
/* Layout: one-column phone app — fixed top bar, scrolling content, fixed bottom tab bar with a raised "add match" button; sheets slide up from the bottom. */
:root{
  --bg:#0A1120; --surface:#121B2C; --surface2:#1A2538; --line:#25344B;
  --fg:#EDF2F9; --muted:#8B99AF; --faint:#5D6B82;
  --accent:#38BDF8; --accent-ink:#04263A;
  --go:#22D47B; --go-ink:#04301A;
  --gold:#F4B740; --bad:#F2575C; --mid:#F59E0B;
  --win:#22D47B; --draw:#8B99AF; --loss:#F2575C;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:10px;
  --tab-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF2F7; --surface:#FFFFFF; --surface2:#F3F6FA; --line:#D6DEE9;
    --fg:#0E1726; --muted:#56657C; --faint:#8A97AA;
    --accent:#0284C7; --accent-ink:#FFFFFF;
    --go:#0E9F5A; --go-ink:#FFFFFF;
    --gold:#B7791F; --bad:#D9383E; --mid:#C2700A;
    --win:#0E9F5A; --draw:#6B7890; --loss:#D9383E;
    --shadow:0 10px 30px rgba(15,30,60,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface2:#F3F6FA; --line:#D6DEE9;
  --fg:#0E1726; --muted:#56657C; --faint:#8A97AA;
  --accent:#0284C7; --accent-ink:#FFFFFF;
  --go:#0E9F5A; --go-ink:#FFFFFF;
  --gold:#B7791F; --bad:#D9383E; --mid:#C2700A;
  --win:#0E9F5A; --draw:#6B7890; --loss:#D9383E;
  --shadow:0 10px 30px rgba(15,30,60,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;color:var(--accent);line-height:1}
.brand b{color:var(--fg);font-weight:800}
.top .ttl{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync[data-s="cloud"] i{background:var(--go)}
@media (max-width:430px){.sync span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.sync[data-s="saving"] i{background:var(--mid)}
main{padding-inline:16px;padding-block:14px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tab-h);font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--faint)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .fab{position:relative}
.tabbar .fab span.circle{width:54px;height:54px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:var(--go);color:var(--go-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--go) 40%,transparent);border:4px solid var(--bg)}
.tabbar .fab span.circle svg{width:26px;height:26px}
.tabbar .fab[aria-current="page"]{color:var(--go)}
.badge{position:absolute;top:8px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.tabbar button{position:relative}

/* ---------- generic ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 2px -4px}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec-h button{font-size:13px;font-weight:600;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.chip.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;letter-spacing:.02em;background:var(--surface2);border:1px solid var(--line)}
.btn.pri{background:var(--go);color:var(--go-ink);border-color:transparent}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dng{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:18px;letter-spacing:.04em;margin-bottom:4px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* crest */
.crest{flex:none;display:grid;place-items:center;width:var(--s,34px);height:calc(var(--s,34px)*1.12);clip-path:polygon(50% 0,100% 12%,100% 58%,50% 100%,0 58%,0 12%);background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:calc(var(--s,34px)*.36);letter-spacing:.02em;text-shadow:0 1px 1px rgba(0,0,0,.35)}

/* rating */
.rt{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;background:var(--faint)}
.rt.r9{background:#1F7AE0}.rt.r8{background:#12A150}.rt.r7{background:#5FB83A}.rt.r6{background:#D9A20B}.rt.r5{background:#E26A1B}.rt.r0{background:#D33A3A}
.rt.na{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:
  radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 60%),
  linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:26px solid color-mix(in srgb,var(--fg) 4%,transparent);pointer-events:none}
.hero-top{display:flex;gap:14px;align-items:flex-start}
.ovr{flex:none;width:70px;text-align:center;padding:8px 0 6px;border-radius:12px;background:color-mix(in srgb,var(--gold) 16%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.ovr .num{display:block;font-size:40px;font-weight:800;line-height:.9;color:var(--gold)}
.ovr small{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--gold)}
.pname{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;word-break:break-word}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hero-club{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kpi .num{display:block;font-size:28px;font-weight:700;line-height:1}
.kpi span{display:block;margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.form{display:flex;gap:6px}
.form .f{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:10px;background:var(--surface2)}
.wdl{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;color:#fff}
.wdl.W{background:var(--win)}.wdl.D{background:var(--draw)}.wdl.L{background:var(--loss)}.wdl.N{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.mini .num{font-size:22px;font-weight:700}

/* match rows */
.mlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 12px;text-align:left;border-top:1px solid var(--line);width:100%}
.mrow:first-child{border-top:0}
.mrow:active{background:var(--surface2)}
.mdate{text-align:center;line-height:1.05}
.mdate .num{display:block;font-size:20px;font-weight:700}
.mdate small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mmid{min-width:0}
.mopp{display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mopp .vs{color:var(--muted);font-size:12px;font-weight:600}
.mcomp{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.score{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:17px}
.ga{display:flex;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.ga b{color:var(--fg)}
.season-h{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.12em;color:var(--muted);margin:8px 2px -6px;display:flex;justify-content:space-between}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:120px}
thead th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);background:var(--surface2)}
tbody tr+tr td{border-top:1px solid var(--line)}
tfoot td{border-top:2px solid var(--line);font-weight:700}
td.hl{color:var(--accent);font-weight:700}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .trk{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar .trk i{display:block;height:100%;border-radius:4px;background:var(--accent)}

/* svg charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* list items */
.ilist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .s{font-size:12.5px;color:var(--muted)}
.ico{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line)}
.ico svg{width:22px;height:22px}
.qty{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--gold)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-grid button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left}
.menu-grid button .ico{color:var(--accent)}
.menu-grid button b{font-weight:700}
.menu-grid button small{color:var(--muted);font-size:12px;margin-top:-6px}
.menu-grid .badge{top:12px;right:12px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;height:44px;padding:0 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:16px}
textarea.inp{height:auto;min-height:120px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:12px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.stepper{display:flex;align-items:center;height:44px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.stepper button{width:44px;height:100%;display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--accent)}
.stepper input{flex:1;min-width:0;height:100%;border:0;background:transparent;text-align:center;font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:600;width:100%;text-align:left}
.toggle .sw{flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"] .sw{background:var(--go)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(18px)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{height:36px;padding:0 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:13px}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fsec{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.form-tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:10;background:var(--bg);padding-block:8px;margin-top:-8px}
.savebar{position:sticky;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;margin-top:6px}
.savebar .btn{box-shadow:var(--shadow)}
.edit-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--mid) 16%,transparent);border:1px solid color-mix(in srgb,var(--mid) 45%,transparent);color:var(--mid);font-weight:700}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.suggest button{height:28px;padding:0 10px;border-radius:14px;font-size:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}

/* goal map */
.goal{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:300/130;touch-action:manipulation}
.goal svg{width:100%;height:100%;display:block}
.goal .net{stroke:color-mix(in srgb,var(--fg) 12%,transparent);stroke-width:1;stroke-dasharray:2 3}
.goal .post{fill:none;stroke:var(--fg);stroke-width:5;stroke-linejoin:round}
.goal .bg{fill:var(--surface2)}
.zone-leg{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.zone-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,8,18,.55);opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;border-top:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h3{flex:1;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.sheet-h::before{content:"";position:absolute;left:50%;top:6px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--line)}
.sheet-b{overflow-y:auto;padding-inline:16px;padding-block:14px calc(20px + env(safe-area-inset-bottom,0px))}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}

/* match detail */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;padding:16px 8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.scoreboard .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px;min-width:0;word-break:break-word}
.scoreboard .sc{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center}
.kv .num{display:block;font-size:20px;font-weight:700;line-height:1.1}
.kv .rt{font-size:16px;letter-spacing:0;color:#fff;height:26px;margin-bottom:2px}
.kv > div > span:not(.num):not(.rt){font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* news */
.news{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.news.unread{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.news h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase}

/* welcome */
.welcome{min-height:calc(100% - 20px);display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:30px}
.welcome .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.85;letter-spacing:-.01em;color:var(--accent)}
.welcome .big b{display:block;color:var(--fg)}
.pitch{height:120px;border-radius:16px;border:2px solid color-mix(in srgb,var(--go) 50%,transparent);position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--go) 10%,transparent) 0 40px,color-mix(in srgb,var(--go) 5%,transparent) 40px 80px)}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid color-mix(in srgb,var(--go) 50%,transparent)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid color-mix(in srgb,var(--go) 50%,transparent)}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom,0px));z-index:80;max-width:420px;margin:0 auto;padding:12px 14px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;transition:.2s;pointer-events:none}
.toast.on{transform:none;opacity:1}
.toast.err{background:var(--bad);color:#fff}

@media (min-width:560px){ .kpis{gap:12px} .pname{font-size:36px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- v2 additions ---------- */
.crest.img{clip-path:none;background:none;width:var(--s,34px);height:var(--s,34px);overflow:hidden;text-shadow:none;display:block}
.crest.img img{width:var(--s,34px);height:var(--s,34px);max-width:none;object-fit:contain;display:block}
.crest-btn{flex:none;display:grid;place-items:center;border-radius:8px}
tr.tap{cursor:pointer}
tr.tap:active td{background:var(--surface2)}
.lnk{color:var(--fg);font-weight:600;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 60%,transparent);text-underline-offset:3px}
.kpis.five{grid-template-columns:repeat(5,1fr);gap:6px}
.kpis.five .kpi{padding:9px 4px}
.kpis.five .kpi .num{font-size:23px}
.kpis.five .kpi span:not(.num){font-size:9px;letter-spacing:.06em}
.sgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.srow span{color:var(--muted);min-width:0}
.srow b{font-size:17px}
.srow.zero b{color:var(--faint)}
.wdlbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.wdlbar i{display:block}
.wdlbar .W{background:var(--win)}.wdlbar .D{background:var(--draw)}.wdlbar .L{background:var(--loss)}
.item.flat{border-top:0;padding:8px 0;gap:10px}
.avatar{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:20px;border:2px solid var(--accent)}
.trio-row{display:flex;justify-content:space-around;align-items:flex-end;gap:8px;margin-top:10px;text-align:center}
.trio-row>div{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;flex:1}
.trio-row b{font-size:13px;word-break:break-word}
.trio-row .num{font-size:18px;color:var(--gold)}
.trio-row span{font-size:11px;color:var(--muted)}
.trio-row .me .avatar{width:66px;height:66px;font-size:24px;border-color:var(--gold)}
.trk.dual{height:6px;margin-top:3px}
.tm3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;text-align:center}
.tm3 .num{display:block;font-size:24px;font-weight:700;line-height:1}
.tm3 small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
@media (max-width:380px){ .kpis.five .kpi .num{font-size:19px} .sgrid{grid-template-columns:1fr} }

/* ---------- trophy room ---------- */
.kpis.three{grid-template-columns:repeat(3,1fr)}
.kpi .small-num{line-height:1.6!important;display:block;min-height:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.museum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;padding-top:6px}
@media (min-width:560px){.museum{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tcase{display:flex;flex-direction:column;align-items:stretch;min-width:0;text-align:center}
.tcase .stage{position:relative;height:150px;display:block}
.tcase .glow,.tbig .glow{position:absolute;left:50%;bottom:0;width:150px;height:150px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 38%,transparent),transparent 65%);pointer-events:none}
.tcase .tp{position:absolute;transform:translateX(-50%);object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));display:block}
.tcase .tp .cup-svg,.tbig .cup-svg{width:100%;height:100%}
.tcase .ped-top{position:absolute;left:0;right:0;bottom:-2px;height:26px;z-index:0;background:linear-gradient(180deg,color-mix(in srgb,var(--fg) 10%,var(--surface2)),var(--surface2));clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);border-bottom:0}
.tcase .stage .tp{z-index:2}
.ped-front{display:block;margin-top:2px;padding:4px 0;background:color-mix(in srgb,#000 55%,var(--bg));border-top:3px solid var(--tc);color:#fff;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em}
.plaque{display:flex;flex-direction:column;align-items:center;gap:3px;margin:12px 6px 0;border:2px solid var(--tc);border-radius:10px;background:color-mix(in srgb,#000 40%,var(--surface));overflow:hidden;padding-bottom:8px}
.plaque .ph{align-self:stretch;background:var(--tc);color:#0B1220;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 4px}
.plaque .pn{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.05;text-transform:uppercase;color:#fff;padding:4px 6px 0;overflow-wrap:break-word;text-wrap:balance}
.plaque .pc{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;color:#E2E8F0;padding:0 6px;min-width:0}
.plaque .pc span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plaque .ps{font-size:10.5px;font-style:italic;color:#94A3B8;padding:0 6px}
.tbig{position:relative;width:200px;height:200px;display:grid;place-items:end center}
.tbig img,.tbig svg{position:relative;max-width:180px;max-height:190px;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}

/* ---------- logo database ---------- */
img.cl{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:5px}
td img.cl{width:18px;height:18px}
.logo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:300px;overflow-y:auto}
.logo-grid .lg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.logo-grid .lg img{width:44px;height:44px;object-fit:contain}
.logo-grid .lg span{font-size:10.5px;line-height:1.15;color:var(--muted);text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}

/* ---------- tap feedback ---------- */
.stepper button,.pick button,.btn,.seg button,.toggle,.mrow,.item,.tcase,.news,.menu-grid button,.nt-row,.lg,.cb-opt{transition:background-color .12s,transform .08s,filter .12s}
.stepper button:active,.stepper button.tapped{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.stepper button:active{transform:scale(.92)}
.stepper button.tapped{animation:tapflash .28s ease-out}
@keyframes tapflash{from{background:color-mix(in srgb,var(--accent) 38%,transparent)}to{background:transparent}}
.pick button:active,.seg button:active,.btn:active,.toggle:active{filter:brightness(.82);transform:scale(.97)}
.mrow:active,.item:active,.nt-row:active,.lg:active,.cb-opt:active,.menu-grid button:active{background:var(--surface2)}
/* ---------- combobox ---------- */
.cb{position:relative}
.cb-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:45;max-height:270px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px}
.cb-opt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;text-align:left;font-size:15px}
.cb-opt img{width:26px;height:26px;object-fit:contain;flex:none}
.cb-opt .cb-dot{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.cb-opt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-opt small{flex:none;font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
/* ---------- post-match ---------- */
.pm-head{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.pm-head img{width:34px;height:34px;object-fit:contain}
.pm-comp{font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.pm-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:14px 6px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.pm-score .tm{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pm-score .tm b{font-size:16px;letter-spacing:.04em}
.pm-score .tm small{font-size:11px;color:var(--muted);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pm-score .sc{font-family:var(--f-display);font-weight:800;font-size:48px;line-height:1}
.pm-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pm-box{display:flex;flex-direction:column;gap:3px;padding:10px 8px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);min-width:0}
.pm-rating{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
.pm-tag{font-size:11px;font-weight:700;color:#FFD700}
.pm-opp{font-weight:800;color:#F59E0B;text-transform:uppercase;font-size:13px;line-height:1.1;margin-bottom:4px;overflow-wrap:anywhere}
.pitch{width:100%;height:auto;display:block;border-radius:4px}
/* ---------- national team ---------- */
.nt-hero{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-top:3px solid #F59E0B;padding:14px;display:flex;flex-direction:column;gap:12px}
.nt-title{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:.95;text-transform:uppercase}
.nt-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.nt-kpis small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nt-kpis .num{font-size:28px;font-weight:800;line-height:1.1}
.donut{width:150px;height:150px;display:block;margin:0 auto}
.nt-comp{gap:10px}
.nt-comp img{width:40px;height:40px;object-fit:contain}
.nt-comp h3{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.nt-list{display:flex;flex-direction:column;gap:6px}
.nt-row{display:grid;grid-template-columns:62px minmax(0,1fr) 40px;align-items:center;gap:6px;padding:9px 8px 9px 10px;border-radius:10px;background:var(--surface);border-left:4px solid var(--draw);text-align:left;width:100%}
.nt-row.oW{border-left-color:var(--win)}.nt-row.oL{border-left-color:var(--loss)}
.nt-info{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nt-info b{font-size:11.5px}.nt-info small{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-match{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.nt-t{flex:1;min-width:0;font-size:10.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-t.r{text-align:right}
.nt-sc{font-family:var(--f-display);font-weight:800;font-size:20px;padding:0 2px}
.nt-row.oW .nt-sc{color:var(--win)}.nt-row.oL .nt-sc{color:var(--loss)}.nt-row.oD .nt-sc{color:var(--draw)}
.nt-ga{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;font-weight:700}

.tbl-wrap td:first-child{white-space:nowrap}

</style>
</head>

const t = (k, vars) => { let s = (I18N[LANG] && I18N[LANG][k]) ?? I18N.pt[k] ?? k; if (vars) for (const v in vars) s = s.replace("{"+v+"}", vars[v]); return s; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r=document) => r.querySelector(s);
const int = v => { const n = parseInt(String(v).trim(), 10); return isNaN(n) ? 0 : n; };
const flt = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };
const pad = n => String(n).padStart(2, "0");
const todayDMY = () => { const d = new Date(); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
function parseDMY(s){ const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s||"").trim()); if(!m) return null; const d = new Date(+m[3], +m[2]-1, +m[1]); return isNaN(d) ? null : d; }
const dmyToIso = s => { const d = parseDMY(s); return d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : ""; };
const isoToDmy = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; };
const dateNum = s => { const d = parseDMY(s); return d ? d.getTime() : 0; };
function seasonKey(dmy, euro){ const d = parseDMY(dmy); if(!d) return "2025"; const y = d.getFullYear(), m = d.getMonth()+1;
  if(!euro) return String(y); return m >= 7 ? `${y}/${String(y+1).slice(-2)}` : `${y-1}/${String(y).slice(-2)}`; }
function ageOf(dmy){ const d = parseDMY(dmy); if(!d) return null; const n = new Date(); let a = n.getFullYear()-d.getFullYear(); if (n.getMonth()<d.getMonth() || (n.getMonth()===d.getMonth() && n.getDate()<d.getDate())) a--; return a; }
function hue(name){ let h = 0; for (const c of String(name)) h = (h*31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function initials(name){ const w = String(name||"?").replace(/[^\p{L}\p{N} -]/gu,"").split(/[\s-]+/).filter(Boolean); if(!w.length) return "?"; return (w.length===1 ? w[0].slice(0,3) : w.slice(0,3).map(x=>x[0]).join("")).toUpperCase(); }
function customLogo(n){ try{ return Store.logos[n] || Store.lower[String(n||"").trim().toLowerCase()] || null; }catch(e){ return null; } }
function logoOf(n){ if(!n) return null; const c = customLogo(n); if(c) return c; try{ const e = LogoDB.resolve(n); return e ? e.f : null; }catch(e){ return null; } }
const crest = (name, s=34) => logoOf(name) ? `<span class="crest img" style="--s:${s}px" aria-hidden="true"><img src="${logoOf(name)}" alt="" width="${s}" height="${s}" loading="lazy"></span>` : `<span class="crest" style="--s:${s}px;--c:hsl(${hue(name)} 55% 38%)" aria-hidden="true">${esc(initials(name))}</span>`;
function rtClass(n){ n = +n; if(!n) return "na"; return n>=9?"r9":n>=8?"r8":n>=7?"r7":n>=6?"r6":n>=5?"r5":"r0"; }
const rating = n => `<span class="rt ${rtClass(n)}">${(+n) ? (+n).toFixed(1) : "–"}</span>`;
function parseMoney(v){ if (typeof v === "number") return v; const s = String(v||"").toUpperCase().replace(/[€$£R\s]/g,"").replace(",", "."); const m = /([\d.]+)\s*([KMB])?/.exec(s); if(!m) return 0; const n = parseFloat(m[1]); return n * ({K:1e3, M:1e6, B:1e9}[m[2]] || 1); }
function fmtMoney(n){ if(!n) return "€ 0"; if (n>=1e9) return "€ "+(n/1e9).toFixed(2).replace(/\.?0+$/,"")+"B"; if(n>=1e6) return "€ "+(n/1e6).toFixed(1).replace(/\.0$/,"")+"M"; if(n>=1e3) return "€ "+Math.round(n/1e3)+"K"; return "€ "+Math.round(n); }
const isAbsent = pos => ABSENT_ALL.includes(pos);
const isHomeCode = l => ["C","H","CASA","HOME"].includes(String(l||"C").toUpperCase());
function outcome(j){ try{ const [a,b] = String(j.Resultado||"").split(" ")[0].split("-").map(x=>parseInt(x,10)); if(isNaN(a)||isNaN(b)) return null;
  const mine = isHomeCode(j.Local) ? a : b, theirs = isHomeCode(j.Local) ? b : a; return mine>theirs?"W":mine<theirs?"L":"D"; }catch(e){ return null; } }
function scoreSplit(j){ const [a,b] = String(j.Resultado||"").split(" ")[0].split("-").map(x=>parseInt(x,10)); if(isNaN(a)||isNaN(b)) return null; return isHomeCode(j.Local) ? {mine:a,theirs:b} : {mine:b,theirs:a}; }

  for (const k of Object.keys(base)) if (out[k] == null) out[k] = emptySave()[k];
  out.informacoes = Object.assign(emptySave().informacoes, out.informacoes || {});
  return out;
}

/* ================= persistence (on-device) =================
   Everything lives in this phone's IndexedDB (falls back to localStorage). Nothing leaves the device
   unless the user exports the .json. */
const KV = {
  db:null,
  open(){ return new Promise(res=>{ try{ const r = indexedDB.open("prostats", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); }catch(e){ res(false); } }); },
  get(k){ if(!this.db){ try{ const v = localStorage.getItem("ps_"+k); return Promise.resolve(v ? JSON.parse(v) : null); }catch(e){ return Promise.resolve(null); } }
    return new Promise(res=>{ try{ const q = this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); }catch(e){ res(null); } }); },
  set(k,v){ if(!this.db){ try{ localStorage.setItem("ps_"+k, JSON.stringify(v)); }catch(e){} return Promise.resolve(); }
    return new Promise(res=>{ try{ const tx = this.db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete = () => res(); tx.onerror = () => res(); }catch(e){ res(); } }); },
  del(k){ if(!this.db){ try{ localStorage.removeItem("ps_"+k); }catch(e){} return Promise.resolve(); }
    return new Promise(res=>{ try{ const tx = this.db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = () => res(); tx.onerror = () => res(); }catch(e){ res(); } }); }
};
const Store = {
  index:{careers:[], active:null}, timer:null, logos:{}, lower:{}, trophies:{},
  relower(){ this.lower = {}; for(const k in this.logos) this.lower[k.trim().toLowerCase()] = this.logos[k]; },
  async init(){ await KV.open(); try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    const i = await KV.get("index"); if(i && Array.isArray(i.careers)) this.index = i;
    this.logos = (await KV.get("logos")) || {}; this.relower(); this.trophies = (await KV.get("trophies")) || {}; },
  async setTrophy(key, dataUrl, noSave){ const k = normKey(key); if(dataUrl) this.trophies[k] = dataUrl; else delete this.trophies[k]; if(!noSave) await KV.set("trophies", this.trophies); },
  load(id){ return KV.get("save_"+id); },
  meta(save){ const i = save.informacoes||{}; return {name:i["Nome Completo"]||"?", club:i["Clube Atual"]||"", updated:Date.now(), games:(save.ultimas_performances||[]).length}; },
  persist(id, save, now){
    clearTimeout(this.timer);
    const run = async () => {
      setSync("saving");
      await KV.set("save_"+id, JSON.parse(JSON.stringify(save)));
      let c = this.index.careers.find(x=>x.id===id); if(!c){ c = {id}; this.index.careers.push(c); }
      Object.assign(c, this.meta(save)); this.index.active = id;
      await KV.set("index", this.index); setSync("saved");
    };
    if(now) return run(); this.timer = setTimeout(run, 400);
  },
  async setActive(id){ this.index.active = id; await KV.set("index", this.index); },
  async remove(id){ this.index.careers = this.index.careers.filter(x=>x.id!==id);
    if(this.index.active===id) this.index.active = this.index.careers[0]?.id || null;
    await KV.del("save_"+id); await KV.set("index", this.index); },
  async setLogo(name, dataUrl, noSave){ if(dataUrl) this.logos[name] = dataUrl; else { delete this.logos[name]; const lk = String(name).trim().toLowerCase(); for(const k of Object.keys(this.logos)) if(k.trim().toLowerCase()===lk) delete this.logos[k]; } this.relower(); if(!noSave) await KV.set("logos", this.logos); }
};

/* ================= domain: same bookkeeping as desktop aba_adicionar_partida ================= */
let S = null; // active save
let SAMPLE = false;
const nationalTeam = () => S.informacoes["Nacionalidade"] || S.informacoes["Seleção"] || "Brasil";
function statName(comp, isSel){ const u = comp.toUpperCase(); if(isSel){
  if(u.includes("ELIMIN")) return "Elimin. Copa Do Mundo";
  if(u.includes("COPA DO MUNDO") || u.includes("WORLD CUP")) return "Copa Do Mundo";
  if(u.includes("AMISTOSO") || u.includes("FRIENDLY")) return "Amistoso Seleção";
  if(u.includes("COPA AMÉRICA") || u.includes("COPA AMERICA")) return "Copa América"; }
  return comp; }
function suggestType(comp){ const n = comp.toUpperCase();
  if(["ELIMIN","COPA DO MUNDO","WORLD CUP","AMISTOSO","FRIENDLY","COPA AMÉRICA","EUROCOPA","EURO 20"].some(x=>n.includes(x))) return "Seleção";
  if(["LIBERTADORES","CHAMPIONS","SUL-AMERICANA","EUROPA LEAGUE","CONFERENCE"].some(x=>n.includes(x))) return "Continental";
  if(["SUPERCOPA","RECOPA","SUPER CUP","SUPERCUP","COMMUNITY SHIELD"].some(x=>n.includes(x))) return "Supercopa";
  if(["MUNDIAL","INTERCONTINENTAL","CLUB WORLD"].some(x=>n.includes(x))) return "Mundial de Clubes";
  if(["MINEIRO","ESTADUAL","PAULISTA","CARIOCA","GAÚCHO","GAUCHO"].some(x=>n.includes(x))) return "Estadual/Regional";
  if(["COPA","CUP","POKAL","TAÇA","COUPE","COPPA"].some(x=>n.includes(x))) return "Copa Nacional";
  return "Liga Nacional"; }
const isEuroComp = comp => ["PREMIER","LA LIGA","BUNDESLIGA","CHAMPIONS","SERIE A","LIGUE 1","EUROPA","EREDIVISIE"].some(x=>comp.toUpperCase().includes(x)) && !comp.toUpperCase().includes("SERIA A");
function targetDict(tipo){ return ({"Liga Nacional":["dados_temporadas_Liga","lista"],"Copa Nacional":["dados_temporadas_Copas_Nacional","lista"],"Estadual/Regional":["dados_temporadas_Copas_Regional","lista"],"Continental":["dados_temporadas_Copas_Continental","lista"],"Mundial de Clubes":["desmepenho_mundila_de_clubes","lista"],"Supercopa":["dados_temporadas_SuperCopa","dict"]})[tipo] || [null,null]; }
const CLUB_DICTS = ["dados_temporadas_Liga","dados_temporadas_Copas_Nacional","dados_temporadas_Copas_Regional","dados_temporadas_Copas_Continental","desmepenho_mundila_de_clubes"];
function seasonCandidates(j){ const d = parseDMY(j.Data); const out = []; if(j.Temporada) out.push(String(j.Temporada)); if(d && saveUsesEuro()) out.push(seasonKey(j.Data,true));
  if(d){ out.push(seasonKey(j.Data,false), seasonKey(j.Data,true)); } return [...new Set(out)]; }
function isSelMatch(j){ return j.Tipo==="Seleção" || j.Tipo==="National Team" || (j.Time||"")===nationalTeam(); }

/* Finds the detailed record (round, cards, minutes) stored in the per-tournament dictionaries. */
function findSpecific(j){
  const time = j.Time || S.informacoes["Clube Atual"];
  if(!isSelMatch(j)){
    for(const key of CLUB_DICTS){ const d = S[key]||{}; for(const ano of seasonCandidates(j)){ const lst = d[ano]; if(!Array.isArray(lst)) continue;
      const i = lst.findIndex(it => it.length>5 && it[0]===j["Competição"] && it[2]===j.Data && it[5]===j["Adversário"]);
      if(i>=0){ const it = lst[i]; return {where:"club", key, ano, idx:i, rodada:it[1], ca:int(it[10]), e2:int(it[11]), ed:int(it[12]), mins:int(it[13])}; } } }
    for(const ano of seasonCandidates(j)){ const lst = ((S.dados_temporadas_SuperCopa||{})[ano]||{})[j["Competição"]]; if(!Array.isArray(lst)) continue;
      const i = lst.findIndex(it => it.Data===j.Data && it["Adversário"]===j["Adversário"]);
      if(i>=0){ const it = lst[i]; return {where:"super", ano, idx:i, rodada:it.Rodada, ca:int(it["Cartões Amarelos"]), e2:int(it["Expulsões (Dois Amarelos)"]), ed:int(it["Expulsões (Vermelho Direto)"]), mins:int(it["Minutos Jogados"]??90)}; } }
  } else {
    const lst = S["dados_competicoes_por_seleção"][j["Competição"]];
    if(Array.isArray(lst)){ const i = lst.findIndex(it => it[1]===j.Data && it[4]===j["Adversário"]);
      if(i>=0){ const it = lst[i]; return {where:"sel", idx:i, rodada:it[0], ca:int(it[9]), e2:int(it[10]), ed:int(it[11]), mins:int(it[12])}; } }
  }
  return null;
}
function bumpRows(rows, name, d, createIfMissing){ let found = false;
  const out = rows.map(r => { r = [...r]; if(r[0]===name){ r[1]+=d.j; r[2]+=d.g; r[3]+=d.a; r[4]+=d.ca; r[5]+=d.e2; r[6]+=d.ed; r[7]+=d.mins; found = true; } return r; })
    .filter(r => !(d.j<0 || d.g<0 || d.mins<0) || r[1]>0 || r[7]>0);
  if(!found && createIfMissing) out.push([name, d.j, d.g, d.a, d.ca, d.e2, d.ed, d.mins]);
  return out; }
function applyDetails(det, sign){
  const add = (obj,k,v) => { obj[k] = Math.max(0, (obj[k]||0) + sign*(v||0)); };
  add(S.tipo_de_Gols,"Perna Direita",det.PeDireito); add(S.tipo_de_Gols,"Perna Esquerda",det.PeEsquerdo); add(S.tipo_de_Gols,"Cabeça",det.Cabeca);
  add(S.tipo_de_Gols,"Meio Superior",det.CantoSup); add(S.tipo_de_Gols,"Meio Inferior",det.CantoInf); add(S.tipo_de_Gols,"Meio",det.Centro);
  add(S.Bolas_paradas,"Faltas batidas",det.FaltasBat); add(S.Bolas_paradas,"Faltas Convertidas",det.FaltasGol);
  add(S.Bolas_paradas,"Penaltis batidas",det.PenalBat); add(S.Bolas_paradas,"Penaltis Convertidas",det.PenalGol);
}
function applyMinutes(ano, compMin, club, det, sign){
  const g1=int(det.Gol1T), g2=int(det.Gol2T), gx=int(det.GolProrr), tot=g1+g2+gx; if(!tot) return;
  const rows = S.dados_gols_por_minutos = (S.dados_gols_por_minutos||[]).map(r=>[...r]);
  const i = rows.findIndex(r => String(r[0])===String(ano) && r[1]===compMin && r[2]===club);
  if(i>=0){ const r = rows[i]; r[3]+=sign*g1; r[4]+=sign*g2; r[5]+=sign*gx; r[6]+=sign*tot; if(r[6]<=0) rows.splice(i,1); }
  else if(sign>0) rows.push([String(ano), compMin, club, g1, g2, gx, tot]);
}

function removeMatch(idx){
  const j = S.ultimas_performances[idx]; if(!j) return false;
  const det = j.Detalhes || {}; const time = j.Time || S.informacoes["Clube Atual"];
  const g = int(j.Gols), a = int(j["Assistências"]); const dj = isAbsent(j["Posição"]) ? 0 : 1;
  const sel = isSelMatch(j); const compStats = statName(j["Competição"], sel);
  const sp = findSpecific(j); const rem = {ca:sp?sp.ca:0, e2:sp?sp.e2:0, ed:sp?sp.ed:0, mins:sp?sp.mins:(dj?90:0)};
  let ano = j.Temporada || (sp && sp.ano) || null;
  if(sp){
    if(sp.where==="club"){ const lst = S[sp.key][sp.ano]; lst.splice(sp.idx,1); if(!lst.length) delete S[sp.key][sp.ano]; }
    else if(sp.where==="super"){ const box = S.dados_temporadas_SuperCopa[sp.ano]; const lst = box[j["Competição"]]; lst.splice(sp.idx,1); if(!lst.length) delete box[j["Competição"]]; if(!Object.keys(box).length) delete S.dados_temporadas_SuperCopa[sp.ano]; }
    else { const lst = S["dados_competicoes_por_seleção"][j["Competição"]]; lst.splice(sp.idx,1); if(!lst.length) delete S["dados_competicoes_por_seleção"][j["Competição"]]; }
  }
  S.ultimas_performances.splice(idx,1);
  if(!ano) ano = seasonCandidates(j).find(k => S.dados_jogador[k]) || seasonKey(j.Data,false);
  const dj_ = S.dados_jogador[ano]; if(dj_){ dj_.jogos-=dj; dj_.gols-=g; dj_.assistencias-=a; if(dj_.jogos<=0 && dj_.gols<=0) delete S.dados_jogador[ano]; }
  const delta = {j:-dj, g:-g, a:-a, ca:-rem.ca, e2:-rem.e2, ed:-rem.ed, mins:-rem.mins};
  S.dados_desempenho = bumpRows(S.dados_desempenho, compStats, delta, false);
  if(S.dados_temporada_Geral[ano]){ S.dados_temporada_Geral[ano] = bumpRows(S.dados_temporada_Geral[ano], j["Competição"], delta, false); if(!S.dados_temporada_Geral[ano].length) delete S.dados_temporada_Geral[ano]; }
  if(sel) S.dados_desempenho_selecao = bumpRows(S.dados_desempenho_selecao, compStats, delta, false);
  const pc = S.dados_desempenho_por_clubes[time]; if(pc){ pc.jogos-=dj; pc.gols-=g; pc.assistencias-=a; if(pc.jogos<=0 && !pc.titulos) delete S.dados_desempenho_por_clubes[time]; }
  applyDetails(det, -1);
  applyMinutes(ano, sel ? compStats : j["Competição"], time, det, -1);
  return true;
}

/* F = flat form state. Returns {ok, msg}. */
function saveMatch(F, editIdx){
  const data = F.Data.trim(), comp = F.Comp.trim(), adv = F.Adv.trim();
  if(!parseDMY(data) || !comp || !adv) return {ok:false, msg:t("need_fields")};
  const nota = flt(F.Nota); if(nota<0 || nota>10) return {ok:false, msg:t("bad_num")};
  let old = null;
  if(editIdx!=null){ old = S.ultimas_performances[editIdx]; removeMatch(editIdx); }
  const club = F.Clube.trim() || S.informacoes["Clube Atual"]; const pos = F.Pos; const tipo = F.Tipo;
  const g = int(F.Gols), a = int(F.Ast), ca = int(F.Amarelos), e2 = int(F.V2), ed = int(F.VD);
  let mins = int(F.Minutos); let inc = 1; if(!(mins>0) || isAbsent(pos)){ inc = 0; mins = 0; }
  const det = {};
  const strKeys = ["Condicao","AssistRecebidaDe","AssistDadaPara","MinutosGolsPro","MinutosGolsContra","MinutosGolsJogador"];
  const fltKeys = ["xG","xA","DistanciaPercorrida"]; const boolKeys = ["Capitao","MOTM","CleanSheet","GolEmpate","GolVirada"];
  for(const k of DETAIL_KEYS){ const v = F.det[k];
    if(boolKeys.includes(k)) det[k] = !!v; else if(strKeys.includes(k)) det[k] = String(v??""); else if(fltKeys.includes(k)) det[k] = flt(v); else det[k] = int(v); }
  let sup=0, inf=0, cen=0; const mapa = (F.mapa||[]).map(([x,y])=>[x,y]);
  for(const [,y] of mapa){ if(y<0.35) sup++; else if(y>0.65) inf++; else cen++; }
  det.CantoSup = sup; det.CantoInf = inf; det.Centro = cen; det.MapaGols = mapa;
  const ano = seasonKey(data, F.euro);
  const sel = tipo==="Seleção" || club===nationalTeam(); const compStats = statName(comp, sel);
  const local = F.Local.toUpperCase(); const res = F.Resultado.trim();
  S.ultimas_performances.unshift({"Competição":comp, Data:data, "Adversário":adv, Local:local, Gols:g, "Assistências":a, Nota:nota, Resultado:res, "Posição":pos, Time:club, Detalhes:det, Tipo:tipo, Temporada:ano, Minutos:mins});
  S.ultimas_performances.sort((x,y)=>dateNum(y.Data)-dateNum(x.Data));
  if(!sel){ const [key,kind] = targetDict(tipo); if(key){ const d = S[key] = S[key] || {};
      if(kind==="lista"){ (d[ano] = d[ano]||[]).push([comp, F.Rodada, data, local, club, adv, res, pos, g, a, ca, e2, ed, mins]); }

function radar(attrs){
  const keys = ["Attack","Skill","Movement","Power","Mentality","Defending"]; const cx = 150, cy = 118, R = 84;
  const pt = (i, r) => { const a = -Math.PI/2 + i*2*Math.PI/keys.length; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  let g = ""; for(const f of [.25,.5,.75,1]) g += `<polygon points="${keys.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" class="grid"/>`;
  keys.forEach((k,i)=>{ const [x,y] = pt(i,R); g += `<line class="grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; const [lx,ly] = pt(i,R+20);
    g += `<text x="${lx}" y="${ly+4}" text-anchor="middle" style="font-weight:600">${esc(ATTR_LBL[LANG][k])} <tspan style="fill:var(--fg)">${int(attrs[k]??50)}</tspan></text>`; });
  g += `<polygon points="${keys.map((k,i)=>pt(i,R*Math.min(99,int(attrs[k]??50))/99).join(",")).join(" ")}" fill="var(--accent)" fill-opacity=".25" stroke="var(--accent)" stroke-width="2"/>`;
  return `<svg class="chart" viewBox="0 0 300 236" role="img">${g}</svg>`;
}
function goalSVG(dots, interactive){
  // goal frame in a 300x130 box; dots in desktop percentage coords (0..1 across the frame)
  const X1=12, Y1=10, X2=288, Y2=126; let net = "";
  for(let x=X1;x<=X2;x+=18) net += `<line class="net" x1="${x}" y1="${Y1}" x2="${x}" y2="${Y2}"/>`;
  for(let y=Y1;y<=Y2;y+=16) net += `<line class="net" x1="${X1}" y1="${y}" x2="${X2}" y2="${y}"/>`;
  const col = py => py<0.35 ? "#8B5CF6" : py>0.65 ? "#10B981" : "#F59E0B";
  const dd = dots.map(([px,py])=>{ const x = X1+px*(X2-X1), y = Y1+py*(Y2-Y1); return `<circle cx="${x}" cy="${y}" r="9" fill="${col(py)}" fill-opacity=".25"/><circle cx="${x}" cy="${y}" r="5.5" fill="${col(py)}" stroke="#fff" stroke-width="1.5"/>`; }).join("");
  return `<div class="goal" ${interactive?'id="goalPad" role="button" tabindex="0" aria-label="'+esc(t("goalmap_s"))+'"':""}><svg viewBox="0 0 300 130"><rect class="bg" x="0" y="0" width="300" height="130" rx="6"/>${net}<path class="post" d="M${X1},${Y2+3} V${Y1} H${X2} V${Y2+3}"/>${dd}</svg></div>
  <div class="zone-leg"><span><i style="background:#8B5CF6"></i>${t("top")}</span><span><i style="background:#F59E0B"></i>${t("midh")}</span><span><i style="background:#10B981"></i>${t("low")}</span></div>`;
}

function records(){
  const P = S.ultimas_performances.filter(j=>!isAbsent(j["Posição"])); if(!P.length) return null;
  const best = (f) => P.reduce((b,j)=> f(j)>f(b)?j:b, P[0]);
  const chrono = [...P].sort((a,b)=>dateNum(a.Data)-dateNum(b.Data)); let run=0, bestRun=0; for(const j of chrono){ if(int(j.Gols)>0){ run++; bestRun=Math.max(bestRun,run);} else run=0; }
  const wins = P.filter(j=>outcome(j)==="W"); const big = wins.reduce((b,j)=>{ const s=scoreSplit(j); const m = s? s.mine-s.theirs : -1; return !b||m>b.m ? {j,m} : b; }, null);
  const vs = {}; for(const j of P){ vs[j["Adversário"]] = (vs[j["Adversário"]]||0) + int(j.Gols); } const fav = Object.entries(vs).sort((a,b)=>b[1]-a[1])[0];
  const W = wins.length, D = P.filter(j=>outcome(j)==="D").length, L = P.filter(j=>outcome(j)==="L").length;
  const desc = j => `${esc(j["Adversário"])} · ${esc(j.Data)}`;

/* ---------- Time machine ---------- */
function vTimeMachine(){
  const bySeason = {}; for(const j of [...S.ultimas_performances].reverse()){ if(!played(j)) continue; (bySeason[seasonOf(j)] = bySeason[seasonOf(j)]||[]).push(j); }
  const yrs = Object.keys(bySeason).sort((a,b)=>seasonSortKey(b)-seasonSortKey(a) || (b>a?1:-1));
  if(yrs.length<2) return empty(t("no_data"), t("tm_empty"));
  const A = UI.tmA && bySeason[UI.tmA] ? UI.tmA : yrs[0], B = UI.tmB && bySeason[UI.tmB] ? UI.tmB : yrs[1];
  const maxN = Math.max(1, Math.min(bySeason[A].length, bySeason[B].length)); const n = Math.min(UI.tmN || Math.min(10,maxN), maxN);
  const sa = bySeason[A].slice(0,n), sb = bySeason[B].slice(0,n);
  const sum = (l,k) => l.reduce((s,j)=>s+int(j[k]),0); const avg = l => l.length ? l.reduce((s,j)=>s+flt(j.Nota),0)/l.length : 0;
  const cum = l => { let c = 0; return l.map(j=>c+=int(j.Gols)); }; const ca = cum(sa), cb = cum(sb);
  const W = 340, H = 180, L = 26, Bm = 22, T = 10; const top = Math.max(5, ...ca, ...cb) + 1; const x = i => L + (n===1 ? (W-L-10)/2 : i*(W-L-14)/(n-1)); const y = v => H-Bm-(v/top)*(H-Bm-T);
  let g = ""; const step = top<=6?1:top<=15?3:top<=40?5:10; for(let v=0; v<=top; v+=step) g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const line = (arr, c) => `<path d="${arr.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join("")}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>` + arr.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--surface)" stroke="${c}" stroke-width="2"/>`).join("");
  g += line(cb, "var(--gold)") + line(ca, "var(--accent)");
  const lblIdx = n<=10 ? [...Array(n).keys()] : [0, Math.floor(n/2), n-1]; lblIdx.forEach(i=> g += `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${i+1}º</text>`);
  const panel = (s, l, c) => `<div class="card" style="border-color:color-mix(in srgb,${c} 50%,transparent)"><div class="tiny" style="color:${c}">${t("season")} ${esc(s)}</div><div class="tm3"><div><span class="num">${sum(l,"Gols")}</span><small>${t("goals")}</small></div><div><span class="num">${sum(l,"Assistências")}</span><small>${t("assists")}</small></div><div><span class="num">${avg(l).toFixed(2)}</span><small>${t("avg_rating")}</small></div></div></div>`;
  const opts = cur => yrs.map(s=>`<option ${s===cur?"selected":""}>${esc(s)}</option>`).join("");
  return `<div class="fgrid"><div class="field"><span class="lab" style="color:var(--accent)">${t("season")} A</span><select class="inp" id="sel_tmA" data-change="tmA">${opts(A)}</select></div><div class="field"><span class="lab" style="color:var(--gold)">${t("season")} B</span><select class="inp" id="sel_tmB" data-change="tmB">${opts(B)}</select></div></div>
    <div class="field"><span class="lab">${t("first_n")} <b class="num" style="color:var(--fg);font-size:14px">${n}</b></span><input type="range" id="tmN" data-change="tmN" min="1" max="${maxN}" value="${n}"></div>
    <div class="mini-grid">${panel(A,sa,"var(--accent)")}${panel(B,sb,"var(--gold)")}</div>
    <div class="card"><div class="tiny" style="margin-bottom:8px">${t("cum_goals")}</div><svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>${esc(A)}</span><span><i style="background:var(--gold)"></i>${esc(B)}</span></div></div>`;
}

function resizeImage(file, size=160){ /* keeps transparency (PNG) */
  return new Promise((res, rej)=>{ const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
    const k = Math.min(1, size/Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*k)||size; c.height = Math.round(img.height*k)||size;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/png")); }; img.src = fr.result; }; fr.readAsDataURL(file); });
}

function formation(q){
  const F = {1:[[0,0,1]], 2:[[-15,-10,.9],[15,0,1]], 3:[[-20,-15,.85],[20,-15,.85],[0,0,1]], 4:[[-25,-20,.8],[15,-20,.8],[-15,0,1],[25,0,1]], 5:[[-30,-25,.75],[0,-25,.75],[30,-25,.75],[-15,0,1],[15,0,1]]};
  if(F[q]) return F[q]; const out = [];
  if(q<=9){ const nb = Math.ceil(q/2), nf = q-nb; for(let i=0;i<nb;i++) out.push([-(nb-1)*25/2+i*25,-25,.8]); for(let i=0;i<nf;i++) out.push([-(nf-1)*30/2+i*30,5,1]); }

/* ================= Combobox (replaces native <datalist>, which renders badly on Android) ================= */
function comboSource(src){
  const P = S ? S.ultimas_performances : [];
  const uniq = a => [...new Set(a.filter(Boolean))];
  const db = types => LogoDB.list.filter(e => types.includes(e.t)).map(dbLabel);
  if(src==="comp" || src==="trophy") return {mine: uniq([...P.map(j=>j["Competição"]), ...(S?S.conquistas.map(c=>c[1]):[])]), all: uniq([...COMP_SUGGEST, ...db(["l","k"])])};
  if(src==="opp") return {mine: uniq(P.map(j=>j["Adversário"])), all: uniq(db(["c","n"]))};
  if(src==="club") return {mine: uniq(S ? [S.informacoes["Clube Atual"], nationalTeam(), ...Object.keys(S.dados_desempenho_por_clubes)] : []), all: uniq(db(["c","n"]))};
  if(src==="award") return {mine: uniq(S ? [S.informacoes["Clube Atual"], ...P.map(j=>j["Competição"])] : []), all: uniq([...db(["l","k"]), ...db(["c"])])};
  return {mine:[], all:[]};
}
function comboOptions(src, q){
  const {mine, all} = comboSource(src); const k = lkey(q), qt = sigToks(q);
  if(!k) return mine.slice(0, 40).map(n => ({n, mine:true}));
  const score = n => { const nk = lkey(n); if(nk===k) return 100; if(nk.startsWith(k)) return 80; if(nk.includes(k)) return 60;
    const nt = sigToks(n); if(qt.length && qt.every(x => nt.some(c => tokEq(x,c)))) return 50; if(k.length>=4 && lev(k, nk.slice(0,k.length+1), 2)<=2) return 30; return 0; };
  const seen = new Set(), out = [];
  for(const [list, bonus, isMine] of [[mine, 15, true], [all, 0, false]]) for(const n of list){ const kn = lkey(n); if(seen.has(kn)) continue; const s = score(n); if(s){ seen.add(kn); out.push({n, s:s+bonus, mine:isMine}); } }
  return out.sort((a,b)=>b.s-a.s || a.n.length-b.n.length).slice(0, 30);
}

function pitchSVG(pos){
  const W = 130, H = 160; const p = POS_EN2PT[pos] || pos;
  const C = {GOL:[W/2,H-15],ZAG:[W/2,H-45],LD:[W-20,H-50],LE:[20,H-50],VOL:[W/2,H/2+30],MC:[W/2,H/2+10],MEI:[W/2,H/2-30],PE:[20,H/2-40],PD:[W-20,H/2-40],SA:[W/2,H/2-60],ATA:[W/2,25]}[p];
  const lc = "#34D399";
  return `<svg viewBox="0 0 ${W} ${H}" class="pitch" role="img" aria-label="${esc(p)}"><rect x="1" y="1" width="${W-2}" height="${H-2}" fill="#14352B" stroke="${lc}" stroke-width="1.5"/>
    <line x1="1" y1="${H/2}" x2="${W-1}" y2="${H/2}" stroke="${lc}" stroke-width="1.5"/><circle cx="${W/2}" cy="${H/2}" r="16" fill="none" stroke="${lc}" stroke-width="1.5"/>
    <rect x="${W/2-30}" y="1" width="60" height="22" fill="none" stroke="${lc}" stroke-width="1.5"/><rect x="${W/2-30}" y="${H-23}" width="60" height="22" fill="none" stroke="${lc}" stroke-width="1.5"/>
    ${C?`<circle cx="${C[0]}" cy="${C[1]}" r="10" fill="#F59E0B" opacity=".45"/><circle cx="${C[0]}" cy="${C[1]}" r="6" fill="#FACC15" stroke="#fff" stroke-width="2"/><text x="${C[0]}" y="${C[1]+19}" text-anchor="middle" fill="#fff" style="font-size:9px;font-weight:700">${esc(pos)}</text>`:""}</svg>`;
}
function timelineSVG(pro, jog, con){
  const ours = [...new Set([...pro, ...jog])].sort((a,b)=>a-b); const all = [...ours, ...con]; if(!all.length) return "";
  const mx = Math.max(...all, 90); const top = mx<=90 ? 90 : Math.max(120, mx); const marks = top===90 ? [0,45,90] : [0,45,90,120].filter(m=>m<=top);
  const W = 340, H = 150, P = 18, Y = 78; const x = m => P + (m/top)*(W-2*P);
  let g = `<line x1="${P}" y1="${Y}" x2="${W-P}" y2="${Y}" stroke="var(--faint)" stroke-width="4" stroke-linecap="round"/>`;
  marks.forEach(m => g += `<line x1="${x(m)}" y1="${Y-6}" x2="${x(m)}" y2="${Y+6}" stroke="var(--muted)" stroke-width="2"/><text x="${x(m)}" y="${H+8}" text-anchor="middle">${m}'</text>`);
  /* stagger labels on up to 3 rows so close minutes don't overlap */
  const placer = () => { const rows = [-99,-99,-99]; return cx => { let r = rows.findIndex(v => cx - v >= 24); if(r<0) r = rows.indexOf(Math.min(...rows)); rows[r] = cx; return r; }; };
  const up = placer();
  ours.forEach(m => { const mine = jog.includes(m); const cx = x(m); const lift = up(cx)*13;
    g += `<line x1="${cx}" y1="${Y-4}" x2="${cx}" y2="${Y-12}" stroke="${mine?"#F59E0B":"#fff"}" stroke-width="2"/><circle cx="${cx}" cy="${Y-19}" r="7" fill="${mine?"#FFD700":"#10B981"}" stroke="${mine?"#F59E0B":"#fff"}" stroke-width="2"/>
      <text x="${cx}" y="${Y-31-lift}" text-anchor="middle" style="fill:${mine?"#FACC15":"var(--fg)"};font-weight:700">${m}'</text>`; });
  const dn = placer();
  con.forEach(m => { const cx = x(m); const lift = dn(cx)*13;
    g += `<line x1="${cx}" y1="${Y+4}" x2="${cx}" y2="${Y+10}" stroke="#EF4444" stroke-width="2"/><circle cx="${cx}" cy="${Y+17}" r="7" fill="#EF4444" stroke="#fff" stroke-width="2"/><text x="${cx}" y="${Y+38+lift}" text-anchor="middle" style="fill:#F87171;font-weight:700">${m}'</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H+12}">${g}</svg>`;
}

    <circle cx="80" cy="80" r="${R}" fill="none" stroke="#38BDF8" stroke-width="22" stroke-dasharray="${C*(1-fg)} ${C}" stroke-dashoffset="${-C*fg}" transform="rotate(-90 80 80)"/>`:""}

/* goal map taps */
document.addEventListener("pointerdown", e=>{
  const pad_ = e.target.closest && e.target.closest("#goalPad"); if(!pad_ || !UI.F) return;
  const r = pad_.getBoundingClientRect(); const sx = (e.clientX - r.left) / r.width * 300, sy = (e.clientY - r.top) / r.height * 130;
  const X1=12, Y1=10, X2=288, Y2=126; if(sx < X1-8 || sx > X2+8 || sy < Y1-8 || sy > Y2) return;
  const tot = int(UI.F.Gols); if(tot>0 && UI.F.mapa.length >= tot){ toast(t("map_full",{n:tot})); return; }
  const px = Math.round(Math.min(1,Math.max(0,(sx-X1)/(X2-X1)))*1000)/1000, py = Math.round(Math.min(1,Math.max(0,(sy-Y1)/(Y2-Y1)))*1000)/1000;
  UI.F.mapa.push([px,py]); if(tot===0){ UI.F.Gols = String(UI.F.mapa.length); } render();
});
